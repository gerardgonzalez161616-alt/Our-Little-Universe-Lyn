<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shooting Stars + Mensajes</title>
<style>
body{
  background: radial-gradient(ellipse at bottom, #0d1d31 0%, #0c0d13 100%);
  height: 100vh;
  overflow: hidden;
  margin:0;
}
.night{
  position: relative;
  width: 100%;
  height: 100%;
  transform: rotateZ(45deg);
}
.shooting_star{
  position: absolute;
  left: 50%;
  top: 50%;
  height: 2px;
  background: linear-gradient(-45deg, #5f91ff, rgba(0,0,255,0));
  border-radius: 999px;
  filter: drop-shadow(0 0 6px #699bff);
  animation:
    tail 3000ms ease-in-out infinite,
    shooting 3000ms ease-in-out infinite;
}
.shooting_star::before, .shooting_star::after{
  content: '';
  position: absolute;
  top: calc(50% - 1px);
  right: 0;
  height: 2px;
  background: linear-gradient(-45deg, rgba(0,0,255,0), #5f91ff, rgba(0,0,255,0));
  transform: translateX(50%) rotateZ(45deg);
  border-radius: 100%;
  animation: shining 3000ms ease-in-out infinite;
}
.shooting_star::after{ transform: translateX(50%) rotateZ(-45deg); }

.shooting_star:nth-child(1){ top: calc(50% - 400px); left: calc(50% - 300px); animation-delay: 0.2s; }
.shooting_star:nth-child(2){ top: calc(50% - 250px); left: calc(50% - 600px); animation-delay: 0.5s; }
.shooting_star:nth-child(3){ top: calc(50% - 100px); left: calc(50% - 500px); animation-delay: 0.8s; }
.shooting_star:nth-child(4){ top: calc(50% - 350px); left: calc(50% - 100px); animation-delay: 1s; }
.shooting_star:nth-child(5){ top: calc(50% - 50px); left: calc(50% - 650px); animation-delay: 1.2s; }
.shooting_star:nth-child(6){ top: calc(50% - 450px); left: calc(50% + 100px); animation-delay: 1.5s; }
.shooting_star:nth-child(7){ top: calc(50% + 50px); left: calc(50% - 400px); animation-delay: 1.8s; }
.shooting_star:nth-child(8){ top: calc(50% - 300px); left: calc(50% + 200px); animation-delay: 2s; }
.shooting_star:nth-child(9){ top: calc(50% - 150px); left: calc(50% - 200px); animation-delay: 2.2s; }
.shooting_star:nth-child(10){ top: calc(50% + 100px); left: calc(50% - 550px); animation-delay: 2.5s; }
.shooting_star:nth-child(11){ top: calc(50% - 380px); left: calc(50% - 150px); animation-delay: 0.3s; }
.shooting_star:nth-child(12){ top: calc(50% - 200px); left: calc(50% + 350px); animation-delay: 0.6s; }
.shooting_star:nth-child(13){ top: calc(50% + 0px); left: calc(50% - 100px); animation-delay: 0.9s; }
.shooting_star:nth-child(14){ top: calc(50% - 320px); left: calc(50% - 450px); animation-delay: 1.1s; }
.shooting_star:nth-child(15){ top: calc(50% - 80px); left: calc(50% + 400px); animation-delay: 1.4s; }
.shooting_star:nth-child(16){ top: calc(50% + 150px); left: calc(50% - 200px); animation-delay: 1.7s; }
.shooting_star:nth-child(17){ top: calc(50% - 420px); left: calc(50% + 300px); animation-delay: 2.1s; }
.shooting_star:nth-child(18){ top: calc(50% - 180px); left: calc(50% - 350px); animation-delay: 2.4s; }
.shooting_star:nth-child(19){ top: calc(50% + 80px); left: calc(50% + 100px); animation-delay: 2.7s; }
.shooting_star:nth-child(20){ top: calc(50% - 280px); left: calc(50% + 500px); animation-delay: 3s; }
.shooting_star:nth-child(21){ top: calc(50% - 10px); left: calc(50% - 700px); animation-delay: 0.15s; }
.shooting_star:nth-child(22){ top: calc(50% - 360px); left: calc(50% + 450px); animation-delay: 0.45s; }
.shooting_star:nth-child(23){ top: calc(50% + 120px); left: calc(50% - 300px); animation-delay: 0.75s; }
.shooting_star:nth-child(24){ top: calc(50% - 220px); left: calc(50% - 50px); animation-delay: 1.05s; }
.shooting_star:nth-child(25){ top: calc(50% - 400px); left: calc(50% - 600px); animation-delay: 1.35s; }

@keyframes tail{ 0%{ width: 0; } 30%{ width: 100px; } 100%{ width: 0; } }
@keyframes shining{ 0%{ width: 0; } 50%{ width: 30px; } 100%{ width: 0; } }
@keyframes shooting{ 0%{ transform: translateX(0); } 100%{ transform: translateX(400px); } }

/* MENSAJES */
#messages{
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 10;
}
.msg{
  position: absolute;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  font-size: 18px;
  text-shadow: 0 0 10px #5f91ff, 0 0 20px #5f91ff;
  opacity: 0;
  animation: msgFade 4s ease-in-out forwards;
  white-space: nowrap;
}
@keyframes msgFade{
  0%{ opacity: 0; transform: translateY(20px) scale(0.8); }
  20%{ opacity: 1; transform: translateY(0) scale(1); }
  70%{ opacity: 1; }
  100%{ opacity: 0; transform: translateY(-20px) scale(0.9); }
}
</style>
</head>
<body>
<div class="night">
  <div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div>
  <div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div>
  <div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div>
  <div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div>
  <div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div><div class="shooting_star"></div>
</div>

<div id="messages"></div>

<script>
// AQUÍ CAMBIA LOS MENSAJES QUE QUIERAS
const textos = [
  "You are my star",
  "Ask a wish upon a star",
  "You shine brighter than the stars",
  "I love you to the moon and back",
  "Always together",
  "My universe is you, My Lyn",
  "You are my constellation",
  "Stay with me",
  "You are infinite",
    "You are my galaxy",
    "I choose you",
    "You are my light in the dark",
];

const container = document.getElementById("messages");

function crearMensaje(){
  const el = document.createElement("div");
  el.className = "msg";
  el.textContent = textos[Math.floor(Math.random()*textos.length)];
  
  // posición random en cualquier lado
  const x = Math.random() * (window.innerWidth - 200);
  const y = Math.random() * (window.innerHeight - 100);
  el.style.left = x + "px";
  el.style.top = y + "px";
  
  container.appendChild(el);
  setTimeout(()=> el.remove(), 4000);
}

// aparece un mensaje cada 1.2 segundos
setInterval(crearMensaje, 1200);
</script>
</body>
</html>
