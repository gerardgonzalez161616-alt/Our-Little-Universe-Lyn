
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Garden for Lyn ✨</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #03030a;
  font-family: "Segoe UI", sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.message {
  position: fixed;
  top: 9%;
  left: 0;
  width: 100%;
  padding: 0 16px;
  text-align: center;
  color: #ffe4f1;
  opacity: 0;
  animation: appear 3s ease 5s forwards;
  pointer-events: none;
}

.message h1 {
  font-size: clamp(20px, 4vw, 38px);
  font-weight: 300;
  letter-spacing: 5px;
  text-shadow: 0 0 12px #ff5caa,
               0 0 35px #ff168a;
}

.message p {
  font-size: 14px;
  letter-spacing: 2px;
  color: #e6c7e8;
}

@keyframes appear {
  to { opacity: 1; }
}
</style>
</head>

<body>
<canvas id="garden"></canvas>

<div class="message">
  <h1>FOR YOU, LYN ✨</h1>
  <p>The flowers bloom just for you.</p>
</div>

<script>
const canvas = document.getElementById("garden");
const ctx = canvas.getContext("2d");

let w, h, dpr;
let flowers = [];
let particles = [];
let start = performance.now();

const palette = [
  "#ff368f",
  "#ff70b7",
  "#ffacd5",
  "#e84b9b",
  "#ffc0dc"
];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  flowers = [];

  const count = Math.max(16, Math.min(42, Math.floor(w / 15)));

  for (let i = 0; i < count; i++) {
    const x = (i + 0.5) * w / count
             + (Math.random() - 0.5) * (w / count) * 0.6;

    const ground = h * (0.76 + Math.random() * 0.18);

    flowers.push({
      x,
      ground,
      height: h * (0.12 + Math.random() * 0.19),
      size: 7 + Math.random() * 12,
      color: palette[Math.floor(Math.random() * palette.length)],
      delay: Math.random() * 6,
      phase: Math.random() * Math.PI * 2,
      sway: 3 + Math.random() * 5,
      petals: 5 + Math.floor(Math.random() * 3)
    });
  }
}

function glow(x, y, radius, color) {
  ctx.save();
  ctx.shadowBlur = radius;
  ctx.shadowColor = color;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFlower(f, time) {
  const age = Math.max(0, time - f.delay);
  const grow = Math.min(1, age / 3);
  const bloom = Math.max(0, Math.min(1, (age - 1.5) / 2));

  if (grow <= 0) return;

  const sway = Math.sin(time * 1.2 + f.phase) * f.sway;
  const topX = f.x + sway * grow;
  const topY = f.ground - f.height * grow;

  // Tallo
  ctx.strokeStyle = "#24794a";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(f.x, f.ground);
  ctx.quadraticCurveTo(
    f.x + sway * 0.5,
    f.ground - f.height * 0.5 * grow,
    topX, topY
  );
  ctx.stroke();

  // Hojas
  for (const side of [-1, 1]) {
    const leafY = f.ground - f.height * grow * 0.48;

    ctx.save();
    ctx.translate(f.x + sway * 0.5, leafY);
    ctx.rotate(side * -0.65);

    ctx.fillStyle = "#23834c";
    ctx.beginPath();
    ctx.ellipse(
      side * 8, 0, 10 * grow, 4 * grow,
      0, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.restore();
  }

  // Apertura de los pétalos
  const open = Math.min(1, bloom * 1.3);

  if (open > 0) {
    ctx.save();
    ctx.translate(topX, topY);
    ctx.rotate(sway * 0.015);

    for (let i = 0; i < f.petals; i++) {
      const angle = i * Math.PI * 2 / f.petals;
      const distance = f.size * 0.72 * open;

      ctx.save();
      ctx.rotate(angle);
      ctx.translate(distance, 0);
      ctx.rotate(Math.PI / 2);

      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 10 * open;

      ctx.beginPath();
      ctx.ellipse(
        0, 0,
        f.size * 0.42 * open,
        f.size * 0.8 * open,
        0, 0, Math.PI * 2
      );
      ctx.fill();
      ctx.restore();
    }

    // Centro dorado
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#ffd86b";
    ctx.fillStyle = "#ffd86b";
    ctx.beginPath();
    ctx.arc(0, 0, f.size * 0.28 * open, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawParticle(p, time) {
  const x = p.x + Math.sin(time * p.speed + p.phase) * 14;
  const y = (p.y - time * p.rise + h * 2) % h;

  const twinkle = 0.3 + 0.7 *
    Math.abs(Math.sin(time * 2 + p.phase));

  ctx.globalAlpha = twinkle;
  glow(x, y, 10, p.color);
  ctx.globalAlpha = 1;
}

function initParticles() {
  particles = [];

  for (let i = 0; i < 90; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      rise: 5 + Math.random() * 15,
      speed: 0.3 + Math.random(),
      phase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.5 ? "#ff8fc8" : "#ffe5a1"
    });
  }
}

function animate(now) {
  const time = (now - start) / 1000;

  // Cielo nocturno
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#050513");
  sky.addColorStop(0.6, "#160d29");
  sky.addColorStop(1, "#090611");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // Halo lunar
  const halo = ctx.createRadialGradient(
    w * 0.5, h * 0.65, 5,
    w * 0.5, h * 0.65, h * 0.65
  );
  halo.addColorStop(0, "rgba(128,48,111,0.16)");
  halo.addColorStop(1, "rgba(5,5,19,0)");

  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, w, h);

  // Estrellas pequeñas
  for (let i = 0; i < 55; i++) {
    const x = (i * 173.7) % w;
    const y = (i * 97.3) % (h * 0.72);
    const alpha = 0.3 + 0.7 *
      Math.abs(Math.sin(time + i));

    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#fff0fb";
    ctx.fillRect(x, y, 1.3, 1.3);
  }
  ctx.globalAlpha = 1;

  // Partículas mágicas
  particles.forEach(p => drawParticle(p, time));

  // Suelo
  ctx.fillStyle = "#080810";
  ctx.beginPath();
  ctx.ellipse(
    w / 2, h * 1.02, w * 0.85, h * 0.23,
    0, 0, Math.PI * 2
  );
  ctx.fill();

  // Flores
  flowers.sort((a, b) => a.ground - b.ground);
  flowers.forEach(f => drawFlower(f, time));

  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  resize();
  initParticles();
});

resize();
initParticles();
requestAnimationFrame(animate);
</script>
</body>
</html>
