<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;background:#0a0000;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
const canvas=document.getElementById("heartCanvas");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth; canvas.height=innerHeight;
let centerX=canvas.width/2, centerY=canvas.height/2;
const heartPoints=[]; let currentLine=0;
for(let t=0;t<=Math.PI*2;t+=0.015){
 let x=16*Math.pow(Math.sin(t),3);
 let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
 heartPoints.push({x:centerX+x*12, y:centerY-y*12});
}
function drawHeart(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let i=0;i<currentLine;i++){
  const p=heartPoints[i];
  ctx.beginPath(); ctx.moveTo(centerX,centerY); ctx.lineTo(p.x,p.y);
  ctx.strokeStyle=`hsl(340,100%,${55+(i/heartPoints.length)*20}%)`;
  ctx.lineWidth=1.3; ctx.shadowColor="#ff4f8b"; ctx.shadowBlur=8; ctx.stroke();
 }
 if(currentLine<heartPoints.length){currentLine+=2; requestAnimationFrame(drawHeart);}
}
drawHeart();
window.onresize=()=>{canvas.width=innerWidth; canvas.height=innerHeight; centerX=canvas.width/2; centerY=canvas.height/2}
</script>
</body>
</html>
